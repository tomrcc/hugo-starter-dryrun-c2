{{/*
  Primary button. Single root element, so it drops straight into the
  array-item wrapper. hover_brightness is a custom property so that two
  instances on a page don't collide.
*/}}
<a
  class="primary-button"
  href="{{ .button_link }}"
  {{- with ._uuid }} data-rosey-ns="{{ . }}"{{ end }}
  {{ with .button_aria_label }}aria-label="{{ . }}" data-rosey-attrs-explicit='{"aria-label":"button_aria_label"}'{{ end }}
  style="color: {{ .text_color }}; background-color: {{ .background_color }}; border: 2px solid {{ .background_color }}; --hover-brightness: {{ .hover_brightness }};">
  <p>
    {{ with .button_icon }}
      <span class="button__icon"><i class="{{ . }}"></i></span>
    {{ end }}
    <span data-rosey="button_text" data-editable="text" data-prop="button_text" data-type="span">{{ .button_text }}</span>
  </p>
</a>
